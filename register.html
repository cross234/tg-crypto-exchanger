<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Crossflag · Аккаунт · Вход</title>
  <style>
    :root{
      --text:#e9f0ff;
      --muted:#9fb0d4;
      --card: rgba(15, 26, 48, 0.52);
      --border: rgba(255,255,255,.12);
      --ok:#22c55e;
      --bad:#ef4444;
      --btn:#2d5bff;
      --btn2:#1f3fb3;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; color:var(--text); background:#071022;
      overflow-x:hidden;
    }
    .overlay{
      position:fixed; inset:0; z-index:-2;
      background:
        radial-gradient(1100px 700px at 50% -220px, rgba(45,91,255,.22), rgba(0,0,0,0) 65%),
        radial-gradient(900px 600px at 85% 85%, rgba(34,197,94,.10), rgba(0,0,0,0) 60%),
        linear-gradient(180deg, rgba(7,16,34,.84), rgba(7,16,34,.94));
      pointer-events:none;
    }
    .page{
      min-height:100svh;
      display:flex; justify-content:center; align-items:center;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom)) 16px;
    }
    .wrap{ width:100%; max-width:520px; }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .title{ font-weight:1000; font-size:16px; }
    .back{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#fff; font-weight:950;
      padding:10px 12px; border-radius:999px;
      cursor:pointer; text-decoration:none;
      white-space:nowrap;
    }
    .row{
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      margin-bottom:10px;
    }
    .label{ color:var(--muted); font-size:12px; font-weight:950; margin-bottom:6px; }
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color:var(--text);
      outline:none;
      font-weight:1000;
      font-size:15px;
    }
    input::placeholder{ color: rgba(159,176,212,.65); font-weight:900; }
    .hint{ color: rgba(233,240,255,.78); font-size:12px; font-weight:850; line-height:1.45; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .btn{
      border:0;
      border-radius:14px;
      padding:12px 18px;
      background: linear-gradient(180deg, var(--btn), var(--btn2));
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      min-width: 190px;
    }
    .btnGhost{
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:12px 18px;
      background: rgba(255,255,255,.06);
      color:#fff;
      font-weight:1000;
      cursor:pointer;
      min-width: 190px;
    }
    .btn:disabled{ opacity:.7; cursor:not-allowed; }
    .status{
      margin-top:10px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      font-weight:950;
      font-size:13px;
      white-space:pre-line;
      display:none;
    }
    .status.show{ display:block; }
    .status.ok{ border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.10); }
    .status.bad{ border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="page">
    <div class="wrap">
      <div class="card">
        <div class="top">
          <div class="title">Аккаунт · Вход</div>
          <a class="back" href="./index.html">← Назад</a>
        </div>

        <div class="row">
          <div class="hint">
            1) Открой нашего бота и нажми <b>/start</b> (иначе Telegram не даст нам написать тебе первым).<br>
            2) Введи свой <b>username</b> и нажми “Получить код”.<br>
            3) Введи код из ЛС и нажми “Войти”.
          </div>
        </div>

        <div class="row">
          <div class="label">Telegram username</div>
          <input id="u" placeholder="@username" />
        </div>

        <div class="row">
          <div class="label">Код из Telegram</div>
          <input id="c" inputmode="numeric" placeholder="123456" />
        </div>

        <div class="row">
          <div class="label">Реферальный код (необязательно)</div>
          <input id="ref" placeholder="CFXXXXXXXX" />
        </div>

        <div class="actions">
          <button class="btn" id="sendBtn" type="button">Получить код</button>
          <button class="btnGhost" id="loginBtn" type="button">Войти</button>
        </div>

        <div class="status" id="st">—</div>
      </div>
    </div>
  </div>

<script>
  const WORKER_BASE = "https://api.crossflag.org";

  const u = document.getElementById("u");
  const c = document.getElementById("c");
  const st = document.getElementById("st");
  const sendBtn = document.getElementById("sendBtn");
  const loginBtn = document.getElementById("loginBtn");

  // Auto-fill referral code from URL ?ref=CF-XXXXX
  try {
    const urlRef = new URL(location.href).searchParams.get("ref");
    if (urlRef) {
      const refInput = document.getElementById("ref");
      if (refInput) refInput.value = urlRef.trim();
    }
  } catch(_) {}

  function getNext(){
    try { return new URL(location.href).searchParams.get("next") || ""; } catch { return ""; }
  }

  function setStatus(text, kind){
    st.textContent = text;
    st.className = "status show " + (kind || "");
  }

  function normUser(x){
    x = String(x||"").trim();
    if (x.startsWith("@")) x = x.slice(1);
    return x.trim();
  }

  sendBtn.onclick = async () => {
    const username = normUser(u.value);
    if (!username) return setStatus("Введи username.", "bad");

    try{
      sendBtn.disabled = true;
      setStatus("Отправляем код в ЛС…", "ok");

      const res = await fetch(WORKER_BASE + "/api/public/auth/request_code", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ username })
      });
      const j = await res.json().catch(()=>null);
      if (!res.ok || !j || !j.ok) throw new Error(j?.error || ("HTTP " + res.status));

      setStatus("Код отправлен ✅ Проверь ЛС в Telegram.", "ok");
    }catch(e){
      setStatus("Ошибка: " + (e.message || e), "bad");
    }finally{
      sendBtn.disabled = false;
    }
  };

  loginBtn.onclick = async () => {
    const username = normUser(u.value);
    const code = String(c.value||"").trim();
    if (!username) return setStatus("Введи username.", "bad");
    if (!/^\d{6}$/.test(code)) return setStatus("Код должен быть 6 цифр.", "bad");

    try{
      loginBtn.disabled = true;
      setStatus("Проверяем код…", "ok");

      const res = await fetch(WORKER_BASE + "/api/public/auth/verify_code", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ username, code })
      });
      const j = await res.json().catch(()=>null);
      if (!res.ok || !j || !j.ok) throw new Error(j?.error || ("HTTP " + res.status));

      const token = (j.userToken || j.token || '').trim();
        if (token) {
          localStorage.setItem('CF_USER_TOKEN', token);
          localStorage.setItem('user_token', token);
          localStorage.setItem('cf_user_token', token);
        }
      localStorage.setItem("cf_user_username", username);

      // реферальный код можно указать сразу при первом входе (необязательно)
      try{
        const ref = String((document.getElementById("ref")||{}).value || "").trim();
        if (ref && token){
          await fetch(WORKER_BASE + "/api/public/ref/set", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Auth-Token": token,
              "X-User-Token": token,
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ code: ref })
          }).catch(()=>{});
        }
      }catch{}

      const next = getNext();
      setStatus("Готово ✅ Входим…", "ok");
      setTimeout(()=>{
        location.href = next ? next : "./account.html";
      }, 450);
    }catch(e){
      setStatus("Ошибка: " + (e.message || e), "bad");
    }finally{
      loginBtn.disabled = false;
    }
  };
</script>
</body>
</html>
