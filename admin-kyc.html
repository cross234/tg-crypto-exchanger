<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Crossflag · KYC Admin</title>
<style>
:root{--bg:#07101f;--card:#111827;--line:rgba(255,255,255,.1);--text:#f9fafb;--muted:#9ca3af;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--accent:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:22px 14px 40px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.h1{font-size:26px;font-weight:900}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;color:#d1d5db}.badge.APPROVED{border-color:rgba(34,197,94,.6);color:#bbf7d0}.badge.REJECTED,.badge.OCR_FAILED{border-color:rgba(239,68,68,.6);color:#fecaca}.badge.PENDING_REVIEW{border-color:rgba(245,158,11,.6);color:#fde68a}button,input{border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:#0b1220;color:#fff}button{cursor:pointer;font-weight:800;background:#1f2937}button.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5)}button.bad{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5)}button.purple{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.5)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:13px;margin-top:10px}.kv b{color:var(--muted)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar input{min-width:220px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.on{display:flex}.modalBox{max-width:900px;width:100%;max-height:92vh;overflow:auto;background:#020617;border:1px solid var(--line);border-radius:20px;padding:14px}.modal img,.modal video{width:100%;border-radius:14px;background:#000}.status{white-space:pre-wrap;color:#d1d5db;font-size:13px;margin-top:8px}@media(max-width:640px){.top{display:block}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.bar input{width:100%}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="h1">KYC заявки</div><div class="muted">Паспорт РФ, OCR, проверка лица и ручной доступ без KYC</div></div><button onclick="load()">Обновить</button></div>
<div class="card"><b>Ручной доступ без KYC</b><div class="bar"><input id="manualUser" placeholder="username без @"><input id="manualReason" placeholder="причина"><button class="ok" onclick="manual(true)">Разрешить</button><button class="bad" onclick="manual(false)">Забрать доступ</button></div><div id="manualStatus" class="status"></div></div>
<div id="list" class="grid"></div>
</div>
<div id="modal" class="modal" onclick="this.classList.remove('on')"><div class="modalBox" onclick="event.stopPropagation()"><div class="actions"><button onclick="document.getElementById('modal').classList.remove('on')">Закрыть</button></div><div id="viewer"></div></div></div>
<script>
const WORKER_BASE=(localStorage.getItem('worker_base')||localStorage.getItem('WORKER_BASE')||'https://api.crossflag.org').replace(/\/+$/,'');
function tok(){return (localStorage.getItem('admin_token')||localStorage.getItem('ADMIN_TOKEN')||'').trim()}
async function api(path,opts={}){const r=await fetch(WORKER_BASE+path,{...opts,headers:{'X-Admin-Token':tok(),'Content-Type':'application/json',...(opts.headers||{})}});const j=await r.json().catch(()=>({ok:false,error:'Bad JSON'}));if(!r.ok||j.ok===false)throw j;return j}
function fmt(ts){return ts?new Date(ts).toLocaleString('ru-RU'):'—'}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){const box=document.getElementById('list');box.innerHTML='<div class="card">Загрузка...</div>';try{const j=await api('/api/admin/kyc_requests');box.innerHTML=(j.items||[]).map(render).join('')||'<div class="card">Пока KYC заявок нет.</div>'}catch(e){box.innerHTML='<div class="card">Ошибка: '+esc(e.error||e.message||e)+'</div>'}}
function render(x){const o=x.ocr||{};return `<div class="card"><div><b>@${esc(x.username||'—')}</b> <span class="badge ${esc(x.status)}">${esc(x.status)}</span></div><div class="muted">userId: ${esc(x.userId)} · ${fmt(x.updatedAt)}</div><div class="kv"><b>Доступ</b><span>${esc(x.tradingAccess||'')}</span><b>Серия/номер</b><span>${esc((o.passportSeries||'—')+' '+(o.passportNumber||''))}</span><b>Дата рожд.</b><span>${esc(o.birthDate||'—')}</span><b>Дата выдачи</b><span>${esc(o.issueDate||'—')}</span><b>Код</b><span>${esc(o.departmentCode||'—')}</span><b>ФИО</b><span>${esc([o.lastName,o.firstName,o.middleName].filter(Boolean).join(' ')||'—')}</span></div><div class="actions"><button class="purple" onclick="viewFile('${esc(x.userId)}','passport')">Паспорт</button><button class="purple" onclick="viewFile('${esc(x.userId)}','face')">Лицо</button><button class="ok" onclick="decide('${esc(x.userId)}','APPROVE')">Одобрить</button><button class="bad" onclick="decide('${esc(x.userId)}','REJECT')">Отклонить</button><button onclick="manualFor('${esc(x.username)}',true)">Доступ без KYC</button><button onclick="manualFor('${esc(x.username)}',false)">Убрать доступ</button></div></div>`}
async function decide(userId,action){let reason='';if(action==='REJECT')reason=prompt('Причина отклонения','Плохое качество фото / данные не совпадают')||'';try{await api('/api/admin/kyc/'+encodeURIComponent(userId),{method:'POST',body:JSON.stringify({action,reason})});await load()}catch(e){alert(e.error||e.message||e)}}
async function viewFile(userId,type){try{const r=await fetch(WORKER_BASE+`/api/admin/kyc_file?userId=${encodeURIComponent(userId)}&type=${encodeURIComponent(type)}`,{headers:{'X-Admin-Token':tok()}});if(!r.ok)throw new Error(await r.text());const blob=await r.blob();const url=URL.createObjectURL(blob);document.getElementById('viewer').innerHTML=blob.type.startsWith('video')?`<video src="${url}" controls autoplay></video>`:`<img src="${url}">`;document.getElementById('modal').classList.add('on')}catch(e){alert('Не удалось открыть файл. Проверь R2 KYC_FILES. '+(e.message||e))}}
async function manualFor(username,enabled){document.getElementById('manualUser').value=String(username||'').replace(/^@/,'');await manual(enabled)}
async function manual(enabled){const u=document.getElementById('manualUser').value.trim().replace(/^@/,'');const reason=document.getElementById('manualReason').value.trim();if(!u){alert('Укажи username');return}try{const j=await api('/api/admin/users/'+encodeURIComponent(u)+'/trading_access',{method:'POST',body:JSON.stringify({enabled,reason})});document.getElementById('manualStatus').textContent='Готово: @'+u+' → '+j.user.tradingAccess;await load()}catch(e){document.getElementById('manualStatus').textContent='Ошибка: '+(e.error||e.message||e)}}
load();
</script></body></html>
